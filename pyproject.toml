[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "durable"
version = "0.1.0"
description = "A small, durable task orchestrator: SQLite state, shell commands, retries."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ipoger" }]
keywords = ["orchestration", "task-runner", "sqlite", "retry", "workflow", "scheduler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
durable = "durable.cli:main"

[project.urls]
Homepage = "https://github.com/ipoger/durable"
Issues = "https://github.com/ipoger/durable/issues"

[tool.setuptools]
packages = ["durable", "durable.store"]
